nameOverride: ""
fullnameOverride: ""

app:
  name: sportnotifier
  replicaCount: 1
  image:
    repository: slezkin23/sportnotifier
    tag: ""
    pullPolicy: Always
  imagePullSecrets: []
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  spring:
    profiles: local, datasource_h2


service:
  type: LoadBalancer
  protocol: TCP
  port: 8080
  targetPort: 80


ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
