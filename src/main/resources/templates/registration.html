<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<!-- navbar -->
<div th:replace="~{/navbar::navbar}"></div>

<!-- content -->
<div class="container mt-4">
    <h2>Registration</h2>
    <form id="registrationForm" th:action="@{/api/public/registration}" method="post">
        <div class="form-group">
            <label for="login">Login:</label>
            <input type="text" id="login" name="login" class="form-control" th:required="required">
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" class="form-control" th:required="required">
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</div>

<!-- Подключаем скрипты Bootstrap для взаимодействия с элементами интерфейса -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    document.getElementById("registrationForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const formData = {
            login: document.getElementById("login").value,
            password: document.getElementById("password").value
        };
        fetch(this.getAttribute("action"), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
            .then(response => {
                if (response.ok) {
                    window.location.href = "/login";
                } else {
                    response.text().then(data => alert(data));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Registration failed. Please try again.');
            });
    });
</script>
</body>
</html>
