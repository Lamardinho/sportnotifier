<!-- change-password.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Change password</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>

<!-- navbar -->
<div th:replace="~{fragments/navbar::navbar}"></div>

<!-- content -->
<div class="container mt-4">
    <h2>Change password</h2>
    <form id="changePasswordForm" th:action="@{/api/user/change-password}" method="post">
        <div class="form-group">
            <label for="oldPassword">Old password:</label>
            <input type="password" id="oldPassword" name="old password" class="form-control" th:required="required">
        </div>
        <div class="form-group">
            <label for="newPassword">New password:</label>
            <input type="password" id="newPassword" name="new password" class="form-control" th:required="required">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<!-- Подключаем скрипты Bootstrap для взаимодействия с элементами интерфейса -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous">
</script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous">
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous">
</script>

<script>
    document.getElementById("changePasswordForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const formData = {
            oldPassword: document.getElementById("oldPassword").value,
            newPassword: document.getElementById("newPassword").value
        };
        fetch(this.getAttribute("action"), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
            .then(response => {
                if (response.ok) {
                    window.location.href = "/logout";
                } else {
                    response.text().then(data => alert(data));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('ChangePassword failed. Please try again.');
            });
    });
</script>
</body>
</html>
