<!-- navbar.html -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Main</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/decode-token">decode-token</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/swagger-ui.html" target="_blank">Swagger</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/actuator" target="_blank">Actuator</a>
                </li>
            </ul>
            <!-- Выводим аватар пользователя -->
            <img th:src="${avatarPath}" alt="Avatar" class="avatar mr-2 rounded-circle"
                 style="max-width: 40px; max-height: 40px;">
            <!-- Выводим имя пользователя -->
            <span class="navbar-text mr-2" th:text="${username}"></span>
            <!-- Logout -->
            <button class="btn btn-outline-dark my-2 my-sm-0" type="button" onclick="logout()">Logout</button>
        </div>
    </nav>
</div>

<script>
    function logout() {
        window.location.href = '/logout';
    }
</script>
</body>
</html>
