<!-- navbar.html -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Main</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/decode-token">Decode-token</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/swagger-ui.html" target="_blank">Swagger</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/actuator" target="_blank">Actuator</a>
                </li>
            </ul>

            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                       data-toggle="dropdown"
                       aria-haspopup="true" aria-expanded="false">
                        <img th:src="${avatarPath}" alt="Avatar" class="avatar mr-2 rounded-circle"
                             style="max-width: 40px; max-height: 40px;">
                        <span th:text="${username}"></span>
                    </a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="/change-password">Change Password</a>
                        <a class="dropdown-item" href="/logout">Logout</a>
                    </div>
                </li>
            </ul>

        </div>
    </nav>
</div>
</body>
</html>
