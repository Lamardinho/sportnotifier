server:
  http2:
    enabled: true
  port: ${PORT:8090}
  servlet:
    encoding:
      force-request: true
      charset: UTF-8
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    password:
    url: jdbc:h2:mem:~/sportnotifier;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    #url: jdbc:h2:file:/tmp/db/sportnotifier;AUTO_SERVER=TRUE;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;
    tomcat:
      connection-properties: useUnicode=true;characterEncoding=utf-8
  h2:
    console.enabled: true
  jpa:
    generate-ddl: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: com.lamardinho.sportnotifier.config.H2IdentifierNamingStrategy
    properties:
      hibernate:
        show_sql: false
        use_sql_comments: false
        format_sql: false
        globally-quoted-identifiers: true
        #  liquibase:
        #    enabled: off # WARN !!! if liquibase "on" -> defer-datasource-initialization: false else defer-datasource-initialization: true
  sql:
    init:
      mode: never
    #data-locations:
    # WARN в дефолтном профиле не включаем!!!
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    #  mail:
    #    #default-encoding: UTF-8
    #    host: smtp.yandex.ru
    #    port: 465
    #    username: ${MAIL_SERVER_USERNAME:secret}
    #    password: ${MAIL_SERVER_PASSWORD:secret}
    #    protocol: smtp
    #    properties:
    #      mail:
    #        smtp:
    #          auth: true
    #          starttls:
    #            enable: true
    #          ssl:
    #            enable: true
    #    test-connection: false
    #    #cache:
    #    #type: simple
  #security:    user:      password: ${DEFAULT_PASSWORD:user}      roles: USER, APP_ADMIN

springdoc:
  api-docs:
    path: /api-docs

management:
  endpoint:
    health:
      show-details: when_authorized
    env:
      show-values: never
  endpoints:
    web:
      exposure:
        include: info, health, env, metrics

app:
  remember-me:
    configurer-key: ${REMEMBER_ME_CONFIGURER_KEY:sportnotifier_remember_me_configurer_key}
    keep-in-db: ${REMEMBER_ME_KEEP_IN_DB:false}
  telegram:
    bot:
      token: ${TELEGRAM_BOT_TOKEN:secret}
      send-msg-post-url-template: ${TELEGRAM_SEND-MSG-POST-URL-TEMPLATE:https://api.telegram.org/bot%s/sendMessage?chat_id=%s&text=%s}
    chat-id:
      owner: ${OWNER_CHAT_ID:1}
  football-data-org:
    token: ${FOOTBALL_DATA_ORG_TOKEN:secret}
    scheduler:
      conditional: ${FOOTBALL_DATA_ORG_SCHEDULER_CONDITIONAL:false}
