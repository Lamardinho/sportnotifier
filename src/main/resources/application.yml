server:
  port: ${PORT:8090}
spring:
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    password:
    url: jdbc:h2:mem:~/sportnotifier;DB_CLOSE_DELAY=-1
    tomcat:
      connection-properties: useUnicode=true;characterEncoding=utf-8
  h2:
    console.enabled: true
  jpa:
    generate-ddl: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: com.lamardinho.sportnotifier.config.H2IdentifierNamingStrategy
    properties:
      hibernate:
        show_sql: false
        use_sql_comments: false
        format_sql: false
        globally-quoted-identifiers: true
        #  liquibase:
        #    enabled: off # WARN !!! if liquibase "on" -> defer-datasource-initialization: false else defer-datasource-initialization: true
        #sql:
        #init:
        #data-locations:
        # WARN в дефолтном профиле не включаем!!!
    #  mail:
    #    #default-encoding: UTF-8
    #    host: smtp.yandex.ru
    #    port: 465
    #    username: ${MAIL_SERVER_USERNAME:secret}
    #    password: ${MAIL_SERVER_PASSWORD:secret}
    #    protocol: smtp
    #    properties:
    #      mail:
    #        smtp:
    #          auth: true
    #          starttls:
    #            enable: true
    #          ssl:
    #            enable: true
    #    test-connection: false
    #    #cache:
    #    #type: simple
  security:
    user:
      password: ${DEFAULT_PASSWORD:hello_world}
      roles: USER, APP_ADMIN

springdoc:
  api-docs:
    path: /api-docs

management:
  endpoint:
    health:
      show-details: when_authorized
    env:
      show-values: never
  endpoints:
    web:
      exposure:
        include: info, health, env, metrics

app:
  telegram:
    bot:
      token: ${TELEGRAM_BOT_TOKEN:secret}
      send-msg-post-url-template: ${TELEGRAM_SEND-MSG-POST-URL-TEMPLATE:https://api.telegram.org/bot%s/sendMessage?chat_id=%s&text=%s}
    chat-id:
      owner: ${OWNER_CHAT_ID:1}
  football-data-org:
    token: ${FOOTBALL_DATA_ORG_TOKEN:secret}
    scheduler:
      conditional: ${FOOTBALL_DATA_ORG_SCHEDULER_CONDITIONAL:false}
